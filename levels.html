<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levels - BackDocu Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <h1 class="logo">BackDocu</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="levels.html" class="active">Levels</a>
                <a href="entities.html">Entities (Coming Soon)</a>
                <a href="objects.html">Objects (Coming Soon)</a>
                <a href="#">Submit (Coming Soon)</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <h2>Level Index</h2>
            <p>All recorded levels ordered by designation.</p>
        </section>
        
        <div class="filter-bar">
            <span>Filter Tags:</span>
            <button class="tag-btn active" onclick="filterLevels('All')">All</button>
            <button class="tag-btn" onclick="filterLevels('Inside')">Inside</button>
            <button class="tag-btn" onclick="filterLevels('Dark')">Dark</button>
            <button class="tag-btn" onclick="filterLevels('Cold')">Cold</button>
            <button class="tag-btn" onclick="filterLevels('Safe')">Safe</button>
        </div>
        <ul id="wiki-level-list" class="wiki-list"></ul>
    </main>

    <footer>
        <p>&copy; BackDocu Canon Archive.</p>
    </footer>

    <script src="levels-data.js"></script>
    <script>
        function renderLevels(filterTag = 'All') {
            const listContainer = document.getElementById('wiki-level-list');
            listContainer.innerHTML = '';

            levelsData.forEach(lvl => {
                if (filterTag !== 'All' && !lvl.tags.includes(filterTag)) {
                    return;
                }

                const li = document.createElement('li');
                li.className = `wiki-item ${lvl.isSublevel ? 'sub-level' : ''}`;

                const tagBadges = lvl.tags.map(t => `<span class="inline-tag">${t}</span>`).join(' ');

                li.innerHTML = `
                    <span class="wiki-prefix">${lvl.isSublevel ? '↳ ' : ''}</span>
                    <a href="${lvl.file}" class="wiki-link"><strong>${lvl.number}:</strong> "${lvl.name}"</a>
                    <span class="wiki-difficulty">${lvl.difficulty}</span>
                    <span class="inline-tags-container">${tagBadges}</span>
                `;

                listContainer.appendChild(li);
            });
        }

        function filterLevels(tag) {
            document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderLevels(tag);
        }

        renderLevels();
    </script>
</body>
</html>
